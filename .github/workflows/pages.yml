name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test static pages
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Select public files
        run: |
          mkdir _site
          cp index.html extensions.html privacy.html terms.html styles.css main.js locales.js i18n.js site-config.js links.js .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
